<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142e32"><title>جزر الأسانيد</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Tahoma,Arial,sans-serif;background:#142e32;color:#edf3e5}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #f2ce82;outline-offset:5px}.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);max-width:1400px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;gap:12px}h1{font-size:20px;margin:0 0 5px;font-weight:600;letter-spacing:.2px}.eyebrow{color:#a4baba;font-size:10px;letter-spacing:1px;margin-bottom:7px}header p{margin:0;font-size:11px;color:#9db7b6}.header-actions{display:flex;gap:8px}.control{border:1px solid #ffffff21;background:#ffffff08;color:#e4ede1;border-radius:12px;min-height:44px;padding:8px 13px;font-size:12px;display:flex;align-items:center;gap:7px}.control svg{width:18px;height:18px}.control:disabled{opacity:.35;cursor:default}.breadcrumbs{padding:0 26px 12px;display:flex;gap:7px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-size:11px;color:#9cb6b5;min-height:39px}.breadcrumbs button{border:0;background:none;color:inherit;padding:7px 2px;min-height:32px}.breadcrumbs button:last-child{color:#efd398}.map{position:relative;overflow:auto;min-height:0;direction:ltr;overscroll-behavior:contain;background:radial-gradient(ellipse at 40% 40%,#26474a88,transparent 60%),#142e32;scrollbar-width:thin;scrollbar-color:#7b969344 #142e32}.map:before{content:'';position:fixed;inset:130px 0 65px;pointer-events:none;opacity:.12;background-image:radial-gradient(#c9eee8 .8px,transparent .8px);background-size:24px 24px;mask-image:linear-gradient(transparent,#000,transparent)}.world{position:relative;min-height:100%;transform-origin:0 0;transition:transform .58s cubic-bezier(.3,.02,.2,1),opacity .42s;will-change:transform,opacity}.island{position:absolute;border:0;background:transparent;color:#f5f1df;padding:0;width:260px;height:190px;transform:translate(-50%,-50%);direction:rtl;transition:filter .2s;z-index:2}.island:hover{filter:brightness(1.14)}.island:focus-visible{border-radius:45%}.land-art{width:100%;height:142px;overflow:visible;display:block;filter:drop-shadow(0 16px 18px #08171966);transition:transform .3s}.island:hover .land-art{transform:translateY(-5px)}.island-name{display:block;font-size:15px;font-weight:600;line-height:1.7;max-width:245px;margin:-3px auto 0;text-shadow:0 2px 6px #0007}.island-meta{display:block;font-size:10px;color:#a6bdb5;margin-top:4px}.island .pill{font-size:9px;display:inline-block;padding:4px 10px;border-radius:20px;background:#ffffff0c;color:#cbd9c8;margin-top:7px}.map-heading{position:absolute;top:10px;width:100%;text-align:center;direction:rtl;pointer-events:none}.map-heading .subtitle{color:#91aaa7;font-size:11px;margin-top:8px}.map-heading h2{font-size:17px;font-weight:500;margin:8px 0;color:#e5eadb}.anchor{position:absolute;top:38px;left:50%;transform:translateX(-50%);background:#1c383c;border:1px solid #839c873b;color:#e6d8b5;border-radius:22px;padding:11px 18px;direction:rtl;font-size:12px;white-space:nowrap;z-index:3}.route-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.route-lines path{fill:none;stroke:#8aafa659;stroke-width:1.5;stroke-dasharray:4 8}.route-lines circle{fill:#b3c7ad}.sea-label{position:absolute;color:#567b7d;font-size:10px;letter-spacing:4px;pointer-events:none}.compass{position:absolute;bottom:28px;left:24px;opacity:.35;width:40px;height:40px;pointer-events:none}footer{padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #ffffff0d;color:#9fb4a9;background:#142e32;font-size:11px;line-height:1.8}footer .status{color:#e0d2aa}.leaf-card{position:absolute;left:50%;transform:translateX(-50%);width:min(90%,420px);text-align:center;border:1px solid #ffffff14;background:#1a3539cc;padding:18px;border-radius:18px;direction:rtl;font-size:12px;line-height:1.9;color:#b7c9bd}.leaf-card strong{display:block;color:#eed8a1;font-size:15px;font-weight:500;margin-bottom:5px}.leaf-card .control{margin:14px auto 0;justify-content:center}.progress{display:flex;gap:5px;align-items:center;direction:ltr}.progress i{width:6px;height:6px;background:#456060;border-radius:50%;display:block}.progress i.active{background:#e8ca8b}.reduced-motion .world{transition:none}@media(max-width:600px){header{padding:16px 16px 8px}h1{font-size:18px}.header-actions{gap:5px}.control{padding:7px 10px;font-size:11px;border-radius:10px}.header-actions .home-label{display:none}.breadcrumbs{padding:0 16px 8px;min-height:34px}.island{width:232px;height:168px}.land-art{height:120px}.island-name{font-size:13px}.island-meta{font-size:10px}.island .pill{font-size:9px;padding:3px 8px;margin-top:5px}.anchor{font-size:11px;max-width:90%;overflow:hidden;text-overflow:ellipsis}footer{padding:11px 16px;font-size:10px}.eyebrow{font-size:9px;margin-bottom:5px}.map-heading h2{font-size:15px}.compass{left:12px;width:28px;height:28px}.sea-label{display:none}.branch .island{width:170px}.branch .island-name{font-size:12px;max-width:155px}.branch .land-art{height:105px}.branch .island-meta{font-size:9px}}@media(max-width:350px){.branch .island{width:150px}.branch .island-name{max-width:140px;font-size:11px}.island{width:205px}.header-actions .back-label{display:none}}@media(prefers-reduced-motion:reduce){.world,.land-art{transition:none}}
[aria-busy="true"] .island{pointer-events:none}
.header-actions{flex-wrap:wrap;justify-content:flex-end}.view-switch{text-decoration:none;background:#dfc38b;color:#233b37;border-color:#dfc38b;white-space:nowrap}.view-switch:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(max-width:600px){.header-actions{max-width:54%;gap:5px}.view-switch{font-size:11px}}
</style></head><body><div class="app"><header><div><div class="eyebrow">رحلة في طبقات الرواة</div><h1>جزر الأسانيد</h1><p id="scope">ثلاث صفحات، وثلاث بدايات</p></div><div class="header-actions"><a class="control view-switch" href="../atlas/index.html">الأطلس</a><a class="control view-switch" href="../tree/index.html">شجرة السند</a><a class="control view-switch" href="../layers/index.html">كل الطبقات</a><a class="control view-switch" href="../honeycomb/index.html">الخلايا السداسية</a><a class="control view-switch" href="../poc/norea-page.html">قارئ الصفحة</a><button class="control" id="back" aria-label="الرجوع إلى الطبقة السابقة" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span class="back-label">رجوع</span></button><button class="control" id="home" aria-label="جزر الصحابة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-7 9 7M6 9v11h12V9M10 20v-6h4v6"/></svg><span class="home-label">الصحابة</span></button></div></header><nav class="breadcrumbs" id="breadcrumbs" aria-label="المسار الحالي"></nav><main class="map" id="map" aria-busy="false" aria-label="خريطة جزر الرواة" tabindex="0"><div class="world" id="world"></div></main><footer><span id="hint">اضغط جزيرة لاستكشاف الرواة عنها</span><span class="status" id="status">٣ جزر</span><div class="progress" id="progress" aria-label="عمق المسار"></div></footer></div><script>
// Paths are transcribed from the attached pages, not an exhaustive hadith database.
// A prefix determines the next layer, preventing branches from different chains
// or different source pages from being accidentally combined.
const roots=[{name:'عائشة بنت أبي بكر',title:'أم المؤمنين',page:'الصورة الأولى',color:'#a4b887',sand:'#dec496'}, {name:'أسامة بن زيد بن حارثة',title:'رضي الله عنه',page:'الصورة الثانية',color:'#b4a17a',sand:'#d8b4a0'}, {name:'أنس بن مالك',title:'رضي الله عنه',page:'الصورة الثالثة',color:'#77b5a7',sand:'#c4d7bb'}];
const paths=[];
function chain(root,...names){paths.push([roots[root].name,...names])}
const A=['عروة بن الزبير','محمد بن مسلم الزهري'];
chain(0,...A,'عبد الملك بن عبد العزيز ابن جريج','يحيى بن موسى');chain(0,...A,'عبد الرزاق بن همام','يحيى بن موسى');chain(0,...A,'عقيل بن خالد','المفضل بن فضالة','قتيبة بن سعيد');chain(0,...A,'عقيل بن خالد','يونس بن يزيد','حيان بن موسى');chain(0,...A,'عقيل بن خالد','عبد الله بن المبارك','حيان بن موسى');
['سعيد بن عفير','عبد الله بن يوسف','يحيى بن بكير','سعيد بن سليمان','عبد الله بن مسلمة','قتيبة بن سعيد','أبو الوليد الطيالسي'].forEach(n=>chain(0,...A,'الليث بن سعد',n));chain(0,...A,'فليح بن سليمان','سليمان بن داود أبو الربيع');['إسماعيل بن أبي أويس','عبد الله بن مسلمة','عبد الله بن يوسف','يحيى بن قزعة'].forEach(n=>chain(0,...A,'مالك بن أنس',n));chain(0,...A,'محمد بن أبي حفصة','محمد بن مقاتل');chain(0,...A,'عبد الله بن المبارك','محمد بن مقاتل');
chain(1,'عروة بن الزبير','هشام بن عروة','حماد بن زيد','قتيبة بن سعيد');chain(1,'عروة بن الزبير','هشام بن عروة','حبيب بن عبد الرحمن الأنصاري','أبو بكر بن أبي شيبة');chain(1,'عروة بن الزبير','هشام بن عروة','عبدة بن سليمان الكلابي','أبو بكر بن أبي شيبة');chain(1,'عطاء بن أبي رباح','محمد بن مسلم الزهري','معمر بن راشد','عبد الرزاق بن همام','عبد بن حميد');
const O=['عمرو بن عثمان','علي بن الحسين','محمد بن مسلم الزهري'];['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(1,...O,'شعيب بن أبي حمزة',n));['عبد بن حميد','محمد بن مهران','محمد بن يحيى ابن أبي عمر'].forEach(n=>chain(1,...O,'معمر بن راشد','عبد الرزاق بن همام',n));chain(1,...O,'يونس بن يزيد','عبد الله بن وهب','حرملة بن يحيى');chain(1,'كريب','إبراهيم بن عقبة','زهير بن معاوية','إسحاق بن إبراهيم ابن راهويه');
const N=['قتادة بن دعامة','شعبة بن الحجاج'];chain(2,...N,'محمد بن جعفر غندر','محمد بن المثنى');chain(2,...N,'محمد بن جعفر غندر','محمد بن بشار');chain(2,...N,'عثمان بن عمر','عبد الله بن رجاء');chain(2,...N,'النضر بن شميل','إسحاق بن إبراهيم ابن راهويه');['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(2,...N,'وكيع بن الجراح',n));chain(2,...N,'يحيى بن سعيد القطان','محمد بن المثنى');chain(2,...N,'روح بن عبادة','محمد بن حاتم');chain(2,'قتادة بن دعامة','سعيد بن أبي عروبة','المعتمر بن سليمان','أبو موسى محمد بن المثنى');
let route=[],busy=false;let animationTimer=0;
const map=document.getElementById('map'),world=document.getElementById('world');
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function children(prefix){const names=new Set();if(!prefix.length)return roots.map(r=>r.name);for(const p of paths)if(prefix.every((n,i)=>p[i]===n)&&p.length>prefix.length)names.add(p[prefix.length]);return [...names]}
function branchRoot(){return roots.find(r=>r.name===route[0])}
function landSvg(color,sand,seed){const treeX=seed%2?175:78;return `<svg class="land-art" viewBox="0 0 260 150" aria-hidden="true"><ellipse cx="130" cy="118" rx="108" ry="22" fill="#8dd3c0" opacity=".05"/><ellipse cx="130" cy="118" rx="86" ry="15" fill="#071f25" opacity=".35"/><path d="M21 77 56 55 102 41 165 42 215 66 240 87 223 111 176 127 101 129 51 109Z" fill="${sand}"/><path d="m21 77 35 23 45 18 75-2 47-17 17-12-17 24-47 16-75 2-50-20Z" fill="#526b5d" opacity=".5"/><path d="m25 74 35-24 50-13 49 2 54 21 27 24-43 17-56 13-55-7-37-15Z" fill="${color}"/><path d="m25 74 70 9 46 31-55-7-37-15Z" fill="#e4f0b9" opacity=".2"/><path d="m95 83 64-44 54 21 27 24-43 17-56 13Z" fill="#163d31" opacity=".12"/><path d="m97 80 27-46 29 46Z" fill="#708c73"/><path d="m124 34 8 29 21 17h-29Z" fill="#507564"/><path d="m113 52 11-18 12 21-12-4-5 5Z" fill="#e0e4ce"/><path d="m145 83 22-34 23 34Z" fill="#607b68"/><path d="m167 49 23 34h-23Z" fill="#466854"/><path d="m158 62 9-13 8 14-8-4Z" fill="#e4e8d5"/><g transform="translate(${treeX} 71)"><path d="M0 4v22" stroke="#536147" stroke-width="3"/><path d="m0-20-12 27h24Z" fill="#315c4b"/><path d="m0-20 12 27H0Z" fill="#204e42"/></g><g transform="translate(${treeX+15} 80) scale(.7)"><path d="M0 3v20" stroke="#536147" stroke-width="3"/><path d="m0-20-12 27h24Z" fill="#426850"/></g><path d="m${seed%2?67:197} 90 6-9 9 11-8 4Z" fill="#eee3bd" opacity=".8"/><path d="m61 104 21 8m103-4 14-5" stroke="#f2e4ba" stroke-width="1" opacity=".6"/></svg>`}
function createIsland(name,x,y,rootView,index){const meta=rootView?roots.find(r=>r.name===name):branchRoot();const next=children([...route,name]);const b=document.createElement('button');b.className='island';b.style.left=x+'px';b.style.top=y+'px';b.dataset.name=name;b.setAttribute('aria-label',name+'، '+(next.length?'استكشاف الطبقة التالية':'عرض نهاية المسار'));b.innerHTML=landSvg(meta.color,meta.sand,index)+`<span class="island-name"></span><span class="island-meta"></span><span class="pill"></span>`;b.querySelector('.island-name').textContent=name;b.querySelector('.island-meta').textContent=rootView?meta.title:next.length?'الرواة عنه في الصور':'آخر راوٍ ظاهر في هذا المسار';b.querySelector('.pill').textContent=rootView?meta.page:next.length?next.length+' '+(next.length===1?'مسار تالٍ':'مسارات تالية'):'تفاصيل المسار';b.addEventListener('click',()=>navigate([...route,name],{x,y}));world.append(b);return b}
function render(){const list=children(route),rootView=!route.length;map.classList.toggle('branch',!rootView);const w=map.clientWidth;const visibleH=map.clientHeight;let positions=[];let h=visibleH;world.replaceChildren();
 if(rootView){h=Math.max(visibleH,590);const gap=Math.min(230,(h-115)/3);positions=list.map((_,i)=>({x:w*(i%2?.59:.42),y:105+gap*i+35}));const head=document.createElement('div');head.className='map-heading';head.innerHTML='<h2>من أين تبدأ رحلتك؟</h2><div class="subtitle">اختر صحابياً، واتّبع مسارات الرواية</div>';world.append(head)}
 else if(list.length){const cols=list.length===1?1:w<600?2:Math.min(3,list.length);const rows=Math.ceil(list.length/cols);const stepY=w<600?205:230;h=Math.max(visibleH,155+rows*stepY);positions=list.map((_,i)=>({x:cols===1?w/2:w*(i%cols+.5)/cols,y:185+Math.floor(i/cols)*stepY}));const parent=document.createElement('div');parent.className='anchor';parent.textContent=route.at(-1);world.append(parent);const lines=document.createElementNS('http://www.w3.org/2000/svg','svg');lines.setAttribute('class','route-lines');lines.setAttribute('viewBox',`0 0 ${w} ${h}`);for(const p of positions){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${w/2} 72 C ${w/2} 105 ${p.x} ${p.y-95} ${p.x} ${p.y-63}`);lines.append(path)}world.append(lines)}
 else {h=Math.max(visibleH,540);const terminal=createIsland(route.at(-1),w/2,185,false,route.length);terminal.disabled=true;terminal.querySelector('.pill').textContent='المسار مكتمل';const card=document.createElement('div');card.className='leaf-card';card.style.top='315px';const title=document.createElement('strong');title.textContent='وصلت إلى نهاية هذا المسار';card.append(title);const desc=document.createElement('div');desc.textContent='هذا آخر راوٍ ظاهر في المسار المأخوذ من الصور. يمكنك الرجوع واستكشاف فرع آخر.';card.append(desc);const trail=document.createElement('div');trail.style.marginTop='10px';trail.textContent=route.join(' ← ');card.append(trail);const back=document.createElement('button');back.className='control';back.textContent='العودة إلى الطبقة السابقة';back.addEventListener('click',()=>navigate(route.slice(0,-1),null,true));card.append(back);world.append(card)}
 world.style.height=h+'px';list.forEach((n,i)=>createIsland(n,positions[i].x,positions[i].y,rootView,i));document.getElementById('scope').textContent=rootView?'ثلاث صفحات، وثلاث بدايات':branchRoot().page+' · الطبقة '+route.length+' في المسار';document.getElementById('back').disabled=rootView;document.getElementById('hint').textContent=rootView?'اضغط جزيرة لاستكشاف الرواة عنها':list.length?'اضغط جزيرة للانتقال إلى الطبقة التالية':'جرّب فرعاً آخر من المسار';document.getElementById('status').textContent=(rootView?'٣ جزر':list.length?list.length+' '+(list.length===1?'جزيرة':'جزر'):'نهاية المسار');const progress=document.getElementById('progress');progress.replaceChildren();for(let i=0;i<Math.max(3,route.length+1);i++){const dot=document.createElement('i');if(i<=route.length)dot.className='active';progress.append(dot)}progress.setAttribute('aria-label','عمق المسار: '+route.length);renderCrumbs()}
function renderCrumbs(){const nav=document.getElementById('breadcrumbs');nav.replaceChildren();['الصحابة',...route].forEach((name,i)=>{if(i){const span=document.createElement('span');span.textContent='‹';nav.append(span)}const b=document.createElement('button');b.textContent=name;b.addEventListener('click',()=>navigate(route.slice(0,i),null,true));if(i===route.length)b.setAttribute('aria-current','location');nav.append(b)});nav.scrollLeft=-nav.scrollWidth}
function navigate(next,point,back=false){if(busy||JSON.stringify(next)===JSON.stringify(route))return;busy=true;map.setAttribute('aria-busy','true');const oldHeight=map.clientHeight,w=map.clientWidth;world.style.transform=point?`translate(${w/2-point.x*2.8}px,${oldHeight/2+map.scrollTop-point.y*2.8}px) scale(2.8)`:`translate(${w*.15}px,${oldHeight*.1}px) scale(.7)`;world.style.opacity='0';clearTimeout(animationTimer);animationTimer=setTimeout(()=>{route=next;render();map.scrollTop=0;map.scrollLeft=0;world.style.transition='none';world.style.transform=`translate(${w*.22}px,${oldHeight*.18}px) scale(.56)`;world.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{world.style.transition='';world.style.transform='translate(0,0) scale(1)';world.style.opacity='1';animationTimer=setTimeout(()=>{busy=false;map.setAttribute('aria-busy','false');const focus=world.querySelector('.island');if(focus)focus.focus({preventScroll:true})},reduced?0:580)}))},reduced?0:430)}
document.getElementById('back').addEventListener('click',()=>navigate(route.slice(0,-1),null,true));document.getElementById('home').addEventListener('click',()=>navigate([],null,true));window.addEventListener('keydown',e=>{if(e.key==='Escape'&&route.length)navigate(route.slice(0,-1),null,true)});let lastW=0;new ResizeObserver(()=>{if(map.clientWidth!==lastW){lastW=map.clientWidth;if(!busy)render()}}).observe(map);render();
</script></body></html>
