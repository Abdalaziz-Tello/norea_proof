<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>شجرة السند</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:Tahoma,Arial;background:#f1f3eb;color:#314631}.app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{background:white;padding:16px 20px;display:flex;justify-content:space-between;gap:15px;align-items:center}h1{font-size:19px;margin:0 0 6px}p{font-size:11px;line-height:1.8;color:#79856e;margin:0}.links,.tools,.tabs{display:flex;gap:6px;flex-wrap:wrap}.links{max-width:50%;justify-content:flex-end}.links a,button{font:inherit;font-size:11px;min-height:42px;border:1px solid #cfdac7;background:#fff;color:#3d5638;border-radius:8px;padding:9px 12px;text-decoration:none;cursor:pointer}.bar{padding:12px 20px;background:#fafbf7;border-block:1px solid #e0e5d8;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}button[aria-pressed=true]{background:#395940;color:white}.viewport{overflow:auto;direction:ltr;min-height:0;overscroll-behavior:contain;background-image:radial-gradient(#dae2d0 1px,transparent 1px);background-size:24px 24px;position:relative}.world{position:relative;min-width:100%;min-height:100%}.edges{position:absolute;inset:0;pointer-events:none}.edges path{stroke:#9eb18b;stroke-width:2;fill:none}.person{position:absolute;width:178px;min-height:86px;transform:translateX(-50%);direction:rtl;text-align:center;font-size:12px;line-height:1.8;box-shadow:0 3px 12px #30401b10;background:white;padding:12px}.person small{display:block;font-size:10px;color:#849577}.person[aria-expanded=true]{border:2px solid #75955d;background:#e8f0df}.person.terminal{border-color:#d1b46b;background:#fff8df}.person:focus-visible{outline:2px solid #b6842a;outline-offset:4px}.instruction{text-align:center;font-size:11px;color:#859077;position:absolute;top:13px;width:100%;direction:rtl}footer{padding:12px 20px;background:white;border-top:1px solid #dce4d3;font-size:11px;line-height:1.9;color:#6d7e60}#path{color:#36513c}.status{font-size:10px;color:#819171;margin-top:3px}@media(max-width:600px){header{padding:14px;align-items:flex-start}h1{font-size:17px}.links a{font-size:10px;padding:8px}.bar{padding:10px 14px;gap:8px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}.tabs button{font-size:10px;padding:7px 5px;line-height:1.6}.tools button{font-size:10px;padding:8px 10px}footer{padding:10px 14px;font-size:10px}}
</style></head><body><div class="app"><header><div><h1>شجرة السند</h1><p>افتح كل راوٍ لتُطيل الشجرة إلى نهاية السند</p></div><nav class="links"><a href="../atlas/index.html">الأطلس</a><a href="../layers/index.html">الطبقات</a><a href="../honeycomb/index.html">الخلايا</a></nav></header><div class="bar"><div class="tabs" id="tabs"></div><div class="tools"><button id="all">افتح السند كله</button><button id="collapse">طيّ الفروع</button><button id="root">العودة للجذر</button></div></div><main class="viewport" id="viewport" aria-label="شجرة الرواة القابلة للتمدد"><div class="world" id="world"></div></main><footer><div id="path">اختر راوياً لفتح من رووا عنه</div><div class="status" id="status">الأرقام تمثّل ترتيب الخطوات في السند</div></footer></div><script>
const roots=[{name:'عائشة بنت أبي بكر',title:'أم المؤمنين',page:'الصورة الأولى',color:'#a4b887',sand:'#dec496'}, {name:'أسامة بن زيد بن حارثة',title:'رضي الله عنه',page:'الصورة الثانية',color:'#b4a17a',sand:'#d8b4a0'}, {name:'أنس بن مالك',title:'رضي الله عنه',page:'الصورة الثالثة',color:'#77b5a7',sand:'#c4d7bb'}];
const paths=[];
function chain(root,...names){paths.push([roots[root].name,...names])}
const A=['عروة بن الزبير','محمد بن مسلم الزهري'];
chain(0,...A,'عبد الملك بن عبد العزيز ابن جريج','يحيى بن موسى');chain(0,...A,'عبد الرزاق بن همام','يحيى بن موسى');chain(0,...A,'عقيل بن خالد','المفضل بن فضالة','قتيبة بن سعيد');chain(0,...A,'عقيل بن خالد','يونس بن يزيد','حيان بن موسى');chain(0,...A,'عقيل بن خالد','عبد الله بن المبارك','حيان بن موسى');
['سعيد بن عفير','عبد الله بن يوسف','يحيى بن بكير','سعيد بن سليمان','عبد الله بن مسلمة','قتيبة بن سعيد','أبو الوليد الطيالسي'].forEach(n=>chain(0,...A,'الليث بن سعد',n));chain(0,...A,'فليح بن سليمان','سليمان بن داود أبو الربيع');['إسماعيل بن أبي أويس','عبد الله بن مسلمة','عبد الله بن يوسف','يحيى بن قزعة'].forEach(n=>chain(0,...A,'مالك بن أنس',n));chain(0,...A,'محمد بن أبي حفصة','محمد بن مقاتل');chain(0,...A,'عبد الله بن المبارك','محمد بن مقاتل');
chain(1,'عروة بن الزبير','هشام بن عروة','حماد بن زيد','قتيبة بن سعيد');chain(1,'عروة بن الزبير','هشام بن عروة','حبيب بن عبد الرحمن الأنصاري','أبو بكر بن أبي شيبة');chain(1,'عروة بن الزبير','هشام بن عروة','عبدة بن سليمان الكلابي','أبو بكر بن أبي شيبة');chain(1,'عطاء بن أبي رباح','محمد بن مسلم الزهري','معمر بن راشد','عبد الرزاق بن همام','عبد بن حميد');
const O=['عمرو بن عثمان','علي بن الحسين','محمد بن مسلم الزهري'];['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(1,...O,'شعيب بن أبي حمزة',n));['عبد بن حميد','محمد بن مهران','محمد بن يحيى ابن أبي عمر'].forEach(n=>chain(1,...O,'معمر بن راشد','عبد الرزاق بن همام',n));chain(1,...O,'يونس بن يزيد','عبد الله بن وهب','حرملة بن يحيى');chain(1,'كريب','إبراهيم بن عقبة','زهير بن معاوية','إسحاق بن إبراهيم ابن راهويه');
const N=['قتادة بن دعامة','شعبة بن الحجاج'];chain(2,...N,'محمد بن جعفر غندر','محمد بن المثنى');chain(2,...N,'محمد بن جعفر غندر','محمد بن بشار');chain(2,...N,'عثمان بن عمر','عبد الله بن رجاء');chain(2,...N,'النضر بن شميل','إسحاق بن إبراهيم ابن راهويه');['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(2,...N,'وكيع بن الجراح',n));chain(2,...N,'يحيى بن سعيد القطان','محمد بن المثنى');chain(2,...N,'روح بن عبادة','محمد بن حاتم');chain(2,'قتادة بن دعامة','سعيد بن أبي عروبة','المعتمر بن سليمان','أبو موسى محمد بن المثنى');
const graph=[];
function descendants(prefix){const names=new Set();for(const p of paths)if(prefix.every((n,i)=>p[i]===n)&&p.length>prefix.length)names.add(p[prefix.length]);return [...names]}
function branch(prefix,parent=null){const n={id:graph.length,name:prefix.at(-1),path:prefix,parent,children:[],depth:prefix.length-1};graph.push(n);n.children=descendants(prefix).map(name=>branch([...prefix,name],n.id).id);return n}
const rootNodes=roots.map(r=>branch([r.name]));
let current=0;const expanded=new Set(),viewport=document.getElementById('viewport'),world=document.getElementById('world');let visible=[];
function measure(n){const children=expanded.has(n.id)?n.children:[];n.span=children.length?children.reduce((sum,id)=>sum+measure(graph[id]),0):205;return n.span}
function layout(n,left){n.tx=left+n.span/2;n.ty=65+n.depth*160;visible.push(n);if(expanded.has(n.id)){let offset=left;for(const id of n.children){layout(graph[id],offset);offset+=graph[id].span}}}
function render(anchor){const old=anchor?{x:anchor.tx,y:anchor.ty}:null;const root=rootNodes[current];visible=[];const span=measure(root),width=Math.max(viewport.clientWidth,span+40);layout(root,(width-span)/2);const height=Math.max(viewport.clientHeight,Math.max(...visible.map(n=>n.ty))+150);world.style.width=width+'px';world.style.height=height+'px';world.replaceChildren();const hint=document.createElement('div');hint.className='instruction';hint.textContent='اضغط لفتح الفرع أو طيّه · اسحب شريط التمرير لاستكشاف الشجرة';world.append(hint);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','edges');svg.setAttribute('width',width);svg.setAttribute('height',height);for(const n of visible){if(n.parent!==null){const p=graph[n.parent];const edge=document.createElementNS('http://www.w3.org/2000/svg','path');edge.setAttribute('d',`M ${p.tx} ${p.ty+86} C ${p.tx} ${p.ty+120} ${n.tx} ${n.ty-30} ${n.tx} ${n.ty}`);svg.append(edge)}}world.append(svg);for(const n of visible){const b=document.createElement('button');b.className='person'+(!n.children.length?' terminal':'');b.dataset.id=n.id;b.style.left=n.tx+'px';b.style.top=n.ty+'px';if(n.children.length)b.setAttribute('aria-expanded',expanded.has(n.id));b.setAttribute('aria-label',n.name+'، '+(n.children.length?expanded.has(n.id)?'طي الفروع':'فتح الفروع':'نهاية المسار'));const name=document.createElement('span');name.textContent=n.name;const small=document.createElement('small');small.textContent='الخطوة '+(n.depth+1)+' · '+(n.children.length?expanded.has(n.id)?'− طيّ الفرع':'+ '+n.children.length+' فروع':'نهاية السند في الصور');b.append(name,small);b.addEventListener('click',()=>{document.getElementById('path').textContent=n.path.join(' ← ');if(n.children.length){if(expanded.has(n.id))expanded.delete(n.id);else expanded.add(n.id);render(n);world.querySelector(`[data-id="${n.id}"]`)?.focus({preventScroll:true})}});world.append(b)}document.getElementById('status').textContent=visible.length+' راوياً ظاهراً · '+(Math.max(...visible.map(n=>n.depth))+1)+' خطوات';if(old){viewport.scrollLeft+=anchor.tx-old.x;viewport.scrollTop=Math.max(0,viewport.scrollTop)}document.querySelectorAll('.tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',i===current))}
function centerRoot(){const root=rootNodes[current];viewport.scrollLeft=Math.max(0,root.tx-viewport.clientWidth/2);viewport.scrollTop=0}
roots.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>{current=i;expanded.clear();render();centerRoot();document.getElementById('path').textContent=r.name};document.getElementById('tabs').append(b)});document.getElementById('all').onclick=()=>{function open(n){expanded.add(n.id);n.children.forEach(id=>open(graph[id]))}open(rootNodes[current]);render();centerRoot()};document.getElementById('collapse').onclick=()=>{expanded.clear();render();centerRoot()};document.getElementById('root').onclick=centerRoot;let lastWidth=0;new ResizeObserver(()=>{if(viewport.clientWidth!==lastWidth){lastWidth=viewport.clientWidth;render();centerRoot()}}).observe(viewport);render();centerRoot();
</script></body></html>
