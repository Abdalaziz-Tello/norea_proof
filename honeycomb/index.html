*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:Tahoma,Arial,sans-serif;background:#242426;color:#f6f3ee}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #efc77b;outline-offset:4px}.app{height:100dvh;max-width:1400px;margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:20px 24px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:21px;margin:0 0 6px}.kicker{font-size:10px;color:#bfb4c4;margin-bottom:8px}header p{margin:0;color:#a9a3af;font-size:11px}.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}.navlink,.control{border:1px solid #ffffff22;border-radius:10px;background:#ffffff08;color:#eee7ef;padding:10px 12px;min-height:44px;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.navlink{background:#eee5d0;color:#342a38;border-color:#eee5d0}.crumbs{display:flex;gap:6px;padding:2px 24px 10px;overflow:auto;white-space:nowrap;color:#a99cab;font-size:11px;min-height:39px;scrollbar-width:none}.crumbs button{font:inherit;border:0;background:none;color:inherit;padding:7px 3px}.crumbs button:last-child{color:#e4c889}.map{overflow:auto;min-height:0;direction:ltr;background:radial-gradient(ellipse at 48% 42%,#302936aa,transparent 70%);overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#635764 #242426;position:relative}.world{position:relative;transform-origin:0 0;transition:transform .65s cubic-bezier(.32,.01,.18,1),opacity .45s;will-change:transform,opacity}.region{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;color:#fff;direction:rtl;width:230px;height:220px;isolation:isolate;transition:filter .2s}.region:hover{filter:brightness(1.2)}.region svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 12px 18px #0002)}.region .label{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);border:1px solid #ffffff1c;background:var(--color);color:#fff;padding:9px 13px;border-radius:8px;min-width:126px;max-width:190px;font-size:13px;font-weight:600;line-height:1.7;box-shadow:0 4px 0 #0002;text-shadow:0 1px 2px #0002;white-space:normal}.region .meta{position:absolute;top:calc(47% + 43px);left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#ddd2dd;text-shadow:0 2px 5px #000}.region:focus-visible{outline:none}.region:focus-visible svg{filter:drop-shadow(0 0 4px #f9e0aa)}.region:disabled{cursor:default}.map-heading{position:absolute;top:14px;text-align:center;width:100%;font-size:12px;color:#ada2b2;direction:rtl;line-height:1.9}.parent-tag{display:inline-block;color:#f3dfae;background:#ffffff08;border:1px solid #ffffff16;border-radius:20px;padding:8px 14px;font-size:12px}.connector{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.connector path{fill:none;stroke:#87738a55;stroke-width:1.4;stroke-dasharray:3 7}.zoom-panel{position:absolute;top:10px;left:12px;z-index:4;display:flex;gap:4px}.zoom-panel button{font-size:18px;width:34px;min-height:34px;padding:0;background:#2b282e}.map-wrap{position:relative;min-height:0;display:flex;flex-direction:column}.map{flex:1}.caption{display:block;font-size:10px;color:#b4a5b8;margin-top:6px}.leaf-card{position:absolute;left:50%;transform:translateX(-50%);width:min(90%,420px);border:1px solid #ffffff17;background:#302a34;border-radius:18px;padding:20px;text-align:center;direction:rtl;color:#cbbdcd;font-size:12px;line-height:1.9}.leaf-card strong{color:#ebc994;font-size:15px;display:block;margin-bottom:8px}.leaf-card button{margin-top:15px}footer{background:#242426;border-top:1px solid #ffffff0e;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 24px;font-size:11px;color:#ada2af;line-height:1.8}#layer{color:#e7c58d;white-space:nowrap}[aria-busy=true] .region{pointer-events:none}@media(max-width:600px){header{padding:15px 16px 7px;align-items:flex-start}h1{font-size:18px}.kicker{font-size:9px}.links{max-width:52%;gap:5px}.navlink,.control{font-size:10px;padding:8px 9px;min-height:40px}header p{font-size:10px}.crumbs{padding:2px 16px 9px;font-size:10px}.region .label{font-size:12px;padding:7px 10px;max-width:175px}.region .meta{font-size:9px}.branch .region .label{min-width:100px;max-width:150px;font-size:11px}.map-heading{font-size:11px}footer{padding:10px 16px;font-size:10px}.zoom-panel{top:8px;left:8px}.zoom-panel button{min-height:32px;width:32px;font-size:17px}}@media(prefers-reduced-motion:reduce){.world{transition:none}}
</style></head><body><div class="app"><header><div><div class="kicker">استكشاف داخل استكشاف</div><h1>خلايا الأسانيد</h1><p>كل جزيرة تفتح طبقة جديدة</p></div><div class="links"><a class="navlink" href="../atlas/index.html">الأطلس</a><a class="navlink" href="../tree/index.html">شجرة السند</a><a class="navlink" href="../layers/index.html">كل الطبقات</a><a class="navlink" href="../islands/index.html">الجزر</a><a class="navlink" href="../poc/norea-page.html">القارئ</a><button class="control" id="back" disabled>رجوع</button><button class="control" id="home" aria-label="العودة إلى الصحابة">الصحابة</button></div></header><nav class="crumbs" id="crumbs" aria-label="المسار الحالي"></nav><div class="map-wrap"><div class="zoom-panel"><button class="control" id="plus" aria-label="تكبير الخريطة">+</button><button class="control" id="minus" aria-label="تصغير الخريطة">−</button><button class="control" id="fit" aria-label="ملاءمة الخريطة">⊙</button></div><main class="map" id="map" aria-busy="false" aria-label="خريطة خلايا الأسانيد" tabindex="0"><div class="world" id="world"></div></main></div><footer><span id="hint">اضغط جزيرة، ثم استكشف الخلايا بداخلها</span><span id="layer">الصحابة · ٣ جزر</span></footer></div><script>
const roots=[{name:'عائشة بنت أبي بكر',title:'أم المؤمنين',page:'الصورة الأولى',color:'#a4b887',sand:'#dec496'}, {name:'أسامة بن زيد بن حارثة',title:'رضي الله عنه',page:'الصورة الثانية',color:'#b4a17a',sand:'#d8b4a0'}, {name:'أنس بن مالك',title:'رضي الله عنه',page:'الصورة الثالثة',color:'#77b5a7',sand:'#c4d7bb'}];
const paths=[];
function chain(root,...names){paths.push([roots[root].name,...names])}
const A=['عروة بن الزبير','محمد بن مسلم الزهري'];
chain(0,...A,'عبد الملك بن عبد العزيز ابن جريج','يحيى بن موسى');chain(0,...A,'عبد الرزاق بن همام','يحيى بن موسى');chain(0,...A,'عقيل بن خالد','المفضل بن فضالة','قتيبة بن سعيد');chain(0,...A,'عقيل بن خالد','يونس بن يزيد','حيان بن موسى');chain(0,...A,'عقيل بن خالد','عبد الله بن المبارك','حيان بن موسى');
['سعيد بن عفير','عبد الله بن يوسف','يحيى بن بكير','سعيد بن سليمان','عبد الله بن مسلمة','قتيبة بن سعيد','أبو الوليد الطيالسي'].forEach(n=>chain(0,...A,'الليث بن سعد',n));chain(0,...A,'فليح بن سليمان','سليمان بن داود أبو الربيع');['إسماعيل بن أبي أويس','عبد الله بن مسلمة','عبد الله بن يوسف','يحيى بن قزعة'].forEach(n=>chain(0,...A,'مالك بن أنس',n));chain(0,...A,'محمد بن أبي حفصة','محمد بن مقاتل');chain(0,...A,'عبد الله بن المبارك','محمد بن مقاتل');
chain(1,'عروة بن الزبير','هشام بن عروة','حماد بن زيد','قتيبة بن سعيد');chain(1,'عروة بن الزبير','هشام بن عروة','حبيب بن عبد الرحمن الأنصاري','أبو بكر بن أبي شيبة');chain(1,'عروة بن الزبير','هشام بن عروة','عبدة بن سليمان الكلابي','أبو بكر بن أبي شيبة');chain(1,'عطاء بن أبي رباح','محمد بن مسلم الزهري','معمر بن راشد','عبد الرزاق بن همام','عبد بن حميد');
const O=['عمرو بن عثمان','علي بن الحسين','محمد بن مسلم الزهري'];['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(1,...O,'شعيب بن أبي حمزة',n));['عبد بن حميد','محمد بن مهران','محمد بن يحيى ابن أبي عمر'].forEach(n=>chain(1,...O,'معمر بن راشد','عبد الرزاق بن همام',n));chain(1,...O,'يونس بن يزيد','عبد الله بن وهب','حرملة بن يحيى');chain(1,'كريب','إبراهيم بن عقبة','زهير بن معاوية','إسحاق بن إبراهيم ابن راهويه');
const N=['قتادة بن دعامة','شعبة بن الحجاج'];chain(2,...N,'محمد بن جعفر غندر','محمد بن المثنى');chain(2,...N,'محمد بن جعفر غندر','محمد بن بشار');chain(2,...N,'عثمان بن عمر','عبد الله بن رجاء');chain(2,...N,'النضر بن شميل','إسحاق بن إبراهيم ابن راهويه');['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(2,...N,'وكيع بن الجراح',n));chain(2,...N,'يحيى بن سعيد القطان','محمد بن المثنى');chain(2,...N,'روح بن عبادة','محمد بن حاتم');chain(2,'قتادة بن دعامة','سعيد بن أبي عروبة','المعتمر بن سليمان','أبو موسى محمد بن المثنى');
const palettes=['#b56b97','#b59040','#57a395'];let route=[],busy=false,zoom=1;const map=document.getElementById('map'),world=document.getElementById('world');const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function children(prefix){if(!prefix.length)return roots.map(r=>r.name);const result=new Set();for(const p of paths)if(prefix.every((n,i)=>p[i]===n)&&p.length>prefix.length)result.add(p[prefix.length]);return [...result]}
function hexPoints(x,y,r){return Array.from({length:6},(_,i)=>{const a=(60*i-30)*Math.PI/180;return (x+Math.cos(a)*r).toFixed(2)+','+(y+Math.sin(a)*r).toFixed(2)}).join(' ')}
function cluster(color,seed){let tiles='';const r=18;const extra=[[-3,1],[2,1],[1,-3]];let coords=[];for(let q=-2;q<=2;q++)for(let v=-2;v<=2;v++)if(Math.abs(q+v)<=2)coords.push([q,v]);coords.push(extra[seed%3]);for(const [q,v] of coords){const x=130+Math.sqrt(3)*r*(q+v/2),y=130+1.5*r*v;const tone=(q*3+v*2+seed+12)%5;tiles+=`<polygon points="${hexPoints(x,y,r*.985)}" fill="${color}" opacity="${.23+tone*.055}" stroke="${color}" stroke-width="1.4" stroke-opacity=".4"/>`;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(Math.abs(a+b)<=1){const sx=x+Math.sqrt(3)*5.2*(a+b/2),sy=y+7.8*b;tiles+=`<polygon points="${hexPoints(sx,sy,4.9)}" fill="none" stroke="${color}" stroke-width=".5" opacity=".2"/>`}}return `<svg viewBox="0 0 260 260" aria-hidden="true"><g transform="translate(130 130) scale(1.15) translate(-130 -130)">${tiles}</g></svg>`}
function addRegion(name,x,y,rootView,index,terminal=false){const rootIndex=rootView?roots.findIndex(r=>r.name===name):roots.findIndex(r=>r.name===route[0]);const color=palettes[rootIndex];const next=terminal?[]:children([...route,name]);const el=document.createElement('button');el.className='region';el.style.left=x+'px';el.style.top=y+'px';el.style.setProperty('--color',color);el.dataset.name=name;const size=rootView?map.clientWidth<600?245:300:map.clientWidth<600?190:250;el.style.width=size+'px';el.style.height=size+'px';el.innerHTML=cluster(color,index)+'<span class="label"></span><span class="meta"></span>';el.querySelector('.label').textContent=name;el.querySelector('.meta').textContent=rootView?roots[rootIndex].title:next.length?next.length+' '+(next.length===1?'جزيرة في الداخل':'جزر في الداخل'):'نهاية المسار';el.setAttribute('aria-label',name+'، '+(next.length?'فتح الخلايا التالية':'عرض نهاية المسار'));el.disabled=terminal;el.addEventListener('click',()=>navigate([...route,name],{x,y}));world.append(el)}
function render(){const list=children(route),rootView=!route.length,w=map.clientWidth;let h=map.clientHeight,positions=[];world.replaceChildren();map.classList.toggle('branch',!rootView);const head=document.createElement('div');head.className='map-heading';if(rootView)head.innerHTML='ثلاث جزر، ثلاث بدايات<span class="caption">قرّب جزيرة لتظهر خلايا الرواية التالية</span>';else{const parent=document.createElement('span');parent.className='parent-tag';parent.textContent=route.at(-1);head.append(parent);const caption=document.createElement('span');caption.className='caption';caption.textContent=list.length?'الرواة عنه في المسار المختار':'وصلت إلى آخر راوٍ في المسار';head.append(caption)}world.append(head);
if(rootView){if(w>=700){h=Math.max(h,460);positions=[{x:w*.24,y:h*.48},{x:w*.5,y:h*.64},{x:w*.76,y:h*.43}]}else{h=Math.max(h,645);positions=[{x:w*.38,y:164},{x:w*.64,y:360},{x:w*.38,y:556}]}}
else if(list.length){const cols=list.length===1?1:w<600?2:Math.min(3,list.length),rows=Math.ceil(list.length/cols),step=w<600?211:250;h=Math.max(h,130+rows*step);positions=list.map((_,i)=>({x:w*(i%cols+.5)/cols,y:190+Math.floor(i/cols)*step}));const lines=document.createElementNS('http://www.w3.org/2000/svg','svg');lines.setAttribute('class','connector');lines.setAttribute('viewBox',`0 0 ${w} ${h}`);positions.forEach(p=>{const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${w/2} 79 C ${w/2} 110 ${p.x} ${p.y-100} ${p.x} ${p.y-68}`);lines.append(path)});world.append(lines)}
else{h=Math.max(h,570);addRegion(route.at(-1),w/2,207,false,route.length,true);const card=document.createElement('section');card.className='leaf-card';card.style.top='365px';card.innerHTML='<strong>نهاية هذا المسار</strong><div></div><button class="control">استكشاف فرع آخر</button>';card.querySelector('div').textContent=route.join(' ← ');card.querySelector('button').addEventListener('click',()=>navigate(route.slice(0,-1),null));world.append(card)}
world.style.height=h+'px';list.forEach((n,i)=>addRegion(n,positions[i].x,positions[i].y,rootView,i));document.getElementById('back').disabled=rootView;document.getElementById('layer').textContent=rootView?'الصحابة · ٣ جزر':'الطبقة '+route.length+' · '+(list.length?list.length+' جزر':'نهاية المسار');document.getElementById('hint').textContent=rootView?'اضغط جزيرة، ثم استكشف الخلايا بداخلها':list.length?'كل اسم يفتح شبكة سداسية جديدة':'ارجع لاختيار مسار آخر';const crumbs=document.getElementById('crumbs');crumbs.replaceChildren();['الصحابة',...route].forEach((n,i)=>{if(i){const arrow=document.createElement('span');arrow.textContent='‹';crumbs.append(arrow)}const b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>navigate(route.slice(0,i),null));if(i===route.length)b.setAttribute('aria-current','location');crumbs.append(b)});crumbs.scrollLeft=-crumbs.scrollWidth}
function navigate(next,point){if(busy||JSON.stringify(next)===JSON.stringify(route))return;busy=true;map.setAttribute('aria-busy','true');const w=map.clientWidth,h=map.clientHeight;world.style.transform=point?`translate(${w/2-point.x*3.5}px,${h/2+map.scrollTop-point.y*3.5}px) scale(3.5)`:`translate(${w*.2}px,${h*.1}px) scale(.6)`;world.style.opacity='0';setTimeout(()=>{route=next;zoom=1;render();map.scrollTop=0;map.scrollLeft=0;world.style.transition='none';world.style.transform=`translate(${w*.25}px,${h*.2}px) scale(.5)`;world.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{world.style.transition='';world.style.transform='scale(1)';world.style.opacity='1';setTimeout(()=>{busy=false;map.setAttribute('aria-busy','false');world.querySelector('.region:not(:disabled)')?.focus({preventScroll:true})},reduced?0:650)}))},reduced?0:450)}
function magnify(value){if(busy)return;zoom=Math.max(.6,Math.min(2,value));world.style.transform=`scale(${zoom})`}
document.getElementById('plus').addEventListener('click',()=>magnify(zoom*1.2));document.getElementById('minus').addEventListener('click',()=>magnify(zoom/1.2));document.getElementById('fit').addEventListener('click',()=>{magnify(1);map.scrollLeft=0;map.scrollTop=0});document.getElementById('back').addEventListener('click',()=>navigate(route.slice(0,-1),null));document.getElementById('home').addEventListener('click',()=>navigate([],null));window.addEventListener('keydown',e=>{if(e.key==='Escape'&&route.length)navigate(route.slice(0,-1),null)});let width=0;new ResizeObserver(()=>{if(map.clientWidth!==width){width=map.clientWidth;if(!busy)render()}}).observe(map);render();
</script></body></html>
