<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172e32"><title>أطلس الأسانيد</title><style>
*{box-sizing:border-box}body{margin:0;background:#172e32;color:#eef0db;font-family:Tahoma,Arial}html,body{height:100%;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;background:#14292c}h1{font-size:19px;margin:0 0 6px}header p{font-size:11px;color:#a7bab1;margin:0}.links{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:55%}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}.links a,.tools button{border:1px solid #ffffff22;background:#ffffff09;border-radius:9px;padding:10px;color:#e6ebdf;font-size:11px;min-height:42px;text-decoration:none}.map{position:relative;overflow:hidden;touch-action:none;direction:ltr;background:radial-gradient(#587c7530 1px,transparent 1px),#172e32;background-size:26px 26px;cursor:grab;user-select:none}.map.dragging{cursor:grabbing}.shapes,.nodes{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}.island{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:0;background:none;color:#f7f0db;padding:0;display:grid;place-items:center;cursor:pointer;min-width:64px;min-height:52px}.label{font-size:12px;font-weight:600;padding:8px 12px;max-width:190px;line-height:1.7;border-radius:10px;background:#163230d9;border:1px solid #e4eace28;box-shadow:0 4px 15px #0002;text-align:center;direction:rtl}.label small{display:block;font-size:9px;font-weight:400;color:#b9cebe;margin-top:3px}.island:hover .label{background:#375644}.island:focus-visible{outline:2px solid #edd393;border-radius:30px}.tools{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:5px}.tools button{background:#213c3f;font-size:16px;width:40px;min-height:40px;padding:0}.tools .reset{width:auto;font-size:11px;padding:0 10px}.help{position:absolute;right:12px;top:12px;max-width:48%;font-size:10px;line-height:1.8;color:#afc5ba;background:#14292cb3;border-radius:8px;padding:8px;direction:rtl;pointer-events:none}footer{padding:12px 18px;background:#14292c;border-top:1px solid #ffffff13;font-size:11px;line-height:1.8;display:flex;gap:12px;justify-content:space-between;align-items:center}#trail{max-width:78%;color:#c8d8c6}#depth{color:#efd397;white-space:nowrap}@media(max-width:600px){header{padding:13px 14px;align-items:flex-start}h1{font-size:16px}header p{font-size:10px;line-height:1.7}.links a{font-size:10px;padding:8px;min-height:36px}.label{font-size:11px;max-width:155px;padding:6px 8px}.help{top:64px;max-width:70%;font-size:9px}.tools button{min-height:36px;width:36px}.tools .reset{width:auto}.tools{top:10px;left:10px}footer{font-size:10px;padding:10px 14px}}
</style></head><body><div class="app"><header><div><h1>أطلس الأسانيد</h1><p>اسحب في أي اتجاه · قرّب لتكشف جزر الطبقة التالية</p></div><nav class="links"><a href="../tree/index.html">شجرة السند</a><a href="../islands/index.html">الجزر</a><a href="../honeycomb/index.html">الخلايا</a><a href="../layers/index.html">الطبقات</a><a href="../poc/norea-page.html">القارئ</a></nav></header><main class="map" id="map" aria-busy="false" aria-label="خريطة أسانيد ثنائية الأبعاد" tabindex="0"><svg class="shapes" id="shapes" aria-hidden="true"></svg><div class="nodes" id="nodes"></div><div class="tools"><button id="plus" aria-label="تكبير الخريطة">+</button><button id="minus" aria-label="تصغير الخريطة">−</button><button class="reset" id="reset">كل الصحابة</button></div><div class="help">بإصبع واحد للتحريك، وبإصبعين للتكبير. تظهر الجزر الفرعية تلقائياً عند الاقتراب.</div></main><footer><span id="trail">الصحابة في الصور الثلاث</span><span id="depth">الصحابة</span></footer></div><script>
const roots=[{name:'عائشة بنت أبي بكر',title:'أم المؤمنين',page:'الصورة الأولى',color:'#a4b887',sand:'#dec496'}, {name:'أسامة بن زيد بن حارثة',title:'رضي الله عنه',page:'الصورة الثانية',color:'#b4a17a',sand:'#d8b4a0'}, {name:'أنس بن مالك',title:'رضي الله عنه',page:'الصورة الثالثة',color:'#77b5a7',sand:'#c4d7bb'}];
const paths=[];
function chain(root,...names){paths.push([roots[root].name,...names])}
const A=['عروة بن الزبير','محمد بن مسلم الزهري'];
chain(0,...A,'عبد الملك بن عبد العزيز ابن جريج','يحيى بن موسى');chain(0,...A,'عبد الرزاق بن همام','يحيى بن موسى');chain(0,...A,'عقيل بن خالد','المفضل بن فضالة','قتيبة بن سعيد');chain(0,...A,'عقيل بن خالد','يونس بن يزيد','حيان بن موسى');chain(0,...A,'عقيل بن خالد','عبد الله بن المبارك','حيان بن موسى');
['سعيد بن عفير','عبد الله بن يوسف','يحيى بن بكير','سعيد بن سليمان','عبد الله بن مسلمة','قتيبة بن سعيد','أبو الوليد الطيالسي'].forEach(n=>chain(0,...A,'الليث بن سعد',n));chain(0,...A,'فليح بن سليمان','سليمان بن داود أبو الربيع');['إسماعيل بن أبي أويس','عبد الله بن مسلمة','عبد الله بن يوسف','يحيى بن قزعة'].forEach(n=>chain(0,...A,'مالك بن أنس',n));chain(0,...A,'محمد بن أبي حفصة','محمد بن مقاتل');chain(0,...A,'عبد الله بن المبارك','محمد بن مقاتل');
chain(1,'عروة بن الزبير','هشام بن عروة','حماد بن زيد','قتيبة بن سعيد');chain(1,'عروة بن الزبير','هشام بن عروة','حبيب بن عبد الرحمن الأنصاري','أبو بكر بن أبي شيبة');chain(1,'عروة بن الزبير','هشام بن عروة','عبدة بن سليمان الكلابي','أبو بكر بن أبي شيبة');chain(1,'عطاء بن أبي رباح','محمد بن مسلم الزهري','معمر بن راشد','عبد الرزاق بن همام','عبد بن حميد');
const O=['عمرو بن عثمان','علي بن الحسين','محمد بن مسلم الزهري'];['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(1,...O,'شعيب بن أبي حمزة',n));['عبد بن حميد','محمد بن مهران','محمد بن يحيى ابن أبي عمر'].forEach(n=>chain(1,...O,'معمر بن راشد','عبد الرزاق بن همام',n));chain(1,...O,'يونس بن يزيد','عبد الله بن وهب','حرملة بن يحيى');chain(1,'كريب','إبراهيم بن عقبة','زهير بن معاوية','إسحاق بن إبراهيم ابن راهويه');
const N=['قتادة بن دعامة','شعبة بن الحجاج'];chain(2,...N,'محمد بن جعفر غندر','محمد بن المثنى');chain(2,...N,'محمد بن جعفر غندر','محمد بن بشار');chain(2,...N,'عثمان بن عمر','عبد الله بن رجاء');chain(2,...N,'النضر بن شميل','إسحاق بن إبراهيم ابن راهويه');['أبو بكر بن أبي شيبة','إسحاق بن إبراهيم ابن راهويه','يحيى بن يحيى'].forEach(n=>chain(2,...N,'وكيع بن الجراح',n));chain(2,...N,'يحيى بن سعيد القطان','محمد بن المثنى');chain(2,...N,'روح بن عبادة','محمد بن حاتم');chain(2,'قتادة بن دعامة','سعيد بن أبي عروبة','المعتمر بن سليمان','أبو موسى محمد بن المثنى');
const graph=[];
function descendants(prefix){const names=new Set();for(const p of paths)if(prefix.every((n,i)=>p[i]===n)&&p.length>prefix.length)names.add(p[prefix.length]);return [...names]}
function branch(prefix,parent=null){const n={id:graph.length,name:prefix.at(-1),path:prefix,parent,children:[],depth:prefix.length-1};graph.push(n);n.children=descendants(prefix).map(name=>branch([...prefix,name],n.id).id);return n}
const rootNodes=roots.map(r=>branch([r.name]));
const map=document.getElementById('map'),shapes=document.getElementById('shapes'),nodes=document.getElementById('nodes');let cam={x:0,y:0,k:1},drag=false,suppressUntil=0,animation=0;const threshold=180,maxZoom=9000,points=new Map();let gesture=null;
function place(n,x,y,r){Object.assign(n,{x,y,r});const count=n.children.length;n.children.forEach((id,i)=>{const child=graph[id];const a=(-90+i*360/count)*Math.PI/180;const distance=count===1?0:r*.55;place(child,x+Math.cos(a)*distance,y+Math.sin(a)*distance,r*(count<=1?.32:.24))})}
rootNodes.forEach((n,i)=>place(n,[0,850,425][i],[0,50,780][i],300));
function shape(x,y,r,color,opacity){return `<path d="M ${x-r} ${y} Q ${x-r*.85} ${y-r*.73} ${x-r*.3} ${y-r*.8} Q ${x+r*.2} ${y-r} ${x+r*.75} ${y-r*.53} Q ${x+r*1.07} ${y-r*.2} ${x+r*.94} ${y+r*.35} Q ${x+r*.55} ${y+r*.87} ${x-r*.1} ${y+r*.7} Q ${x-r*.8} ${y+r*.7} ${x-r} ${y} Z" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-opacity=".28" stroke-width="2"/>`}
function render(){const w=map.clientWidth,h=map.clientHeight;shapes.setAttribute('viewBox',`0 0 ${w} ${h}`);let drawing='',labels='',focus=null;function walk(n,color){const x=n.x*cam.k+cam.x,y=n.y*cam.k+cam.y,r=n.r*cam.k;if(x+r<0||x-r>w||y+r<0||y-r>h)return;const expand=n.children.length&&r>=threshold;if(r<26)return;if(r<3500)drawing+=shape(x,y,r,color,expand?.09:.5);if(expand){n.children.forEach(id=>walk(graph[id],color))}else{const diameter=Math.min(r*1.8,260);labels+=`<button class="island" data-id="${n.id}" style="left:${x}px;top:${y}px;width:${diameter}px;height:${Math.min(diameter,180)}px"><span class="label">${n.name}<small>${n.children.length?n.children.length+' جزر فرعية':'نهاية المسار'}</small></span></button>`;const d=Math.hypot(x-w/2,y-h/2);if(!focus||d<focus.distance)focus={node:n,distance:d};if(r>65&&r<500){drawing+=`<path d="M ${x-r*.3} ${y-r*.15} l ${r*.2} ${-r*.25} ${r*.23} ${r*.28} Z" fill="#edf1c8" opacity=".16"/>`}}}
rootNodes.forEach((n,i)=>walk(n,['#ad80a6','#bda073','#71ae98'][i]));shapes.innerHTML=drawing;nodes.innerHTML=labels;if(focus){document.getElementById('trail').textContent=focus.node.path.join(' ← ');document.getElementById('depth').textContent=focus.node.depth?'الخطوة '+(focus.node.depth+1):'الصحابة'}map.dataset.zoom=cam.k.toFixed(4);map.dataset.visibleDepth=focus?focus.node.depth:0}
function fit(){cancelAnimationFrame(animation);map.setAttribute('aria-busy','false');const w=map.clientWidth,h=map.clientHeight;cam.k=Math.min((w-35)/1500,(h-40)/1400);cam.k=Math.max(.1,cam.k);cam.x=w/2-425*cam.k;cam.y=h/2-370*cam.k;render()}
function zoomAt(factor,x=map.clientWidth/2,y=map.clientHeight/2){cancelAnimationFrame(animation);map.setAttribute('aria-busy','false');const wx=(x-cam.x)/cam.k,wy=(y-cam.y)/cam.k;cam.k=Math.max(.08,Math.min(maxZoom,cam.k*factor));cam.x=x-wx*cam.k;cam.y=y-wy*cam.k;render()}
function fly(n){cancelAnimationFrame(animation);map.setAttribute('aria-busy','true');const start={...cam},target=Math.min(maxZoom,(n.children.length?230:120)/n.r),begin=performance.now();function frame(now){let t=Math.min(1,(now-begin)/650);if(matchMedia('(prefers-reduced-motion:reduce)').matches)t=1;const ease=1-(1-t)**3;cam.k=start.k*Math.pow(target/start.k,ease);cam.x=map.clientWidth/2-n.x*cam.k+(start.x-(map.clientWidth/2-n.x*start.k))*(1-ease);cam.y=map.clientHeight/2-n.y*cam.k+(start.y-(map.clientHeight/2-n.y*start.k))*(1-ease);render();if(t<1)animation=requestAnimationFrame(frame);else map.setAttribute('aria-busy','false')}animation=requestAnimationFrame(frame)}
nodes.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b&&performance.now()>suppressUntil)fly(graph[Number(b.dataset.id)])});document.getElementById('plus').onclick=()=>zoomAt(1.5);document.getElementById('minus').onclick=()=>zoomAt(1/1.5);document.getElementById('reset').onclick=fit;
map.addEventListener('wheel',e=>{e.preventDefault();const rect=map.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.003),e.clientX-rect.left,e.clientY-rect.top)},{passive:false});
function baseline(){const p=[...points.values()];if(!p.length){gesture=null;return}const center=p.length>1?{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}:p[0];gesture={start:{...cam},center,anchor:{x:(center.x-cam.x)/cam.k,y:(center.y-cam.y)/cam.k},distance:p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0,count:p.length}}
map.addEventListener('pointerdown',e=>{if(e.target.closest('.tools'))return;cancelAnimationFrame(animation);const rect=map.getBoundingClientRect();points.set(e.pointerId,{x:e.clientX-rect.left,y:e.clientY-rect.top});baseline()});map.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const rect=map.getBoundingClientRect();points.set(e.pointerId,{x:e.clientX-rect.left,y:e.clientY-rect.top});const p=[...points.values()];if(!gesture||gesture.count!==p.length){baseline();return}if(p.length>1){const c={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};cam.k=Math.max(.08,Math.min(maxZoom,gesture.start.k*Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/Math.max(1,gesture.distance)));cam.x=c.x-gesture.anchor.x*cam.k;cam.y=c.y-gesture.anchor.y*cam.k;drag=true}else{const dx=p[0].x-gesture.center.x,dy=p[0].y-gesture.center.y;if(Math.hypot(dx,dy)<4)return;cam.x=gesture.start.x+dx;cam.y=gesture.start.y+dy;drag=true}if(drag){map.setPointerCapture(e.pointerId);map.classList.add('dragging');suppressUntil=performance.now()+350;render()}});function end(e){points.delete(e.pointerId);baseline();if(!points.size){drag=false;map.classList.remove('dragging')}}window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);map.addEventListener('keydown',e=>{const moves={ArrowLeft:[50,0],ArrowRight:[-50,0],ArrowUp:[0,50],ArrowDown:[0,-50]};if(moves[e.key]){e.preventDefault();cam.x+=moves[e.key][0];cam.y+=moves[e.key][1];render()}else if(e.key==='+'||e.key==='=')zoomAt(1.5);else if(e.key==='-')zoomAt(1/1.5)});let lastSize='';new ResizeObserver(()=>{const size=map.clientWidth+'x'+map.clientHeight;if(size!==lastSize){lastSize=size;fit()}}).observe(map);fit();
</script></body></html>
